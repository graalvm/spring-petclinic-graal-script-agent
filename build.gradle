plugins {
  id 'java'
  id 'checkstyle'
  id 'org.springframework.boot' version '4.1.0'
  id 'io.spring.dependency-management' version '1.1.7'
  id 'org.graalvm.buildtools.native' version '1.1.2'
  id 'org.cyclonedx.bom' version '3.4.1'
  id 'io.spring.javaformat' version '0.0.47'
  id "io.spring.nohttp" version "0.0.11"
}

gradle.startParameter.excludedTaskNames += [ "checkFormatAot", "checkFormatAotTest" ]

group = 'org.graalvm.samples'
version = '0.1-SNAPSHOT'

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(25)
  }
}

tasks.withType(JavaCompile).configureEach {
  options.release = 17
}

repositories {
  mavenCentral()
}

ext.checkstyleVersion = "12.3.1"
ext.graalvmVersion = "25.0.3"
ext.langchain4jVersion = "1.18.0"
ext.scriptagentVersion = "0.1.0"
ext.springJavaformatCheckstyleVersion = "0.0.47"
ext.webjarsLocatorLiteVersion = "1.1.3"
ext.webjarsFontawesomeVersion = "4.7.0"
ext.webjarsBootstrapVersion = "5.3.8"

def operatingSystem = System.getProperty('os.name').toLowerCase(Locale.ROOT)
def architecture = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
def architectureAliases = [ 'x86_64': 'amd64', 'x86-64': 'amd64', 'arm64': 'aarch64' ]
def normalizedArchitecture = architectureAliases.getOrDefault(architecture, architecture)
String platform
if (operatingSystem.contains('linux')) {
  platform = "linux-${normalizedArchitecture}"
} else if (operatingSystem.contains('mac')) {
  platform = "darwin-${normalizedArchitecture}"
} else if (operatingSystem.contains('windows')) {
  platform = "windows-${normalizedArchitecture}"
}
def supportedIsolatePlatforms = [ 'linux-amd64', 'linux-aarch64', 'darwin-aarch64', 'windows-amd64' ]
def jsIsolateArtifact = supportedIsolatePlatforms.contains(platform) ? "js-isolate-${platform}" : 'js-isolate'

dependencies {
  implementation 'org.springframework.boot:spring-boot-starter-cache'
  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
  implementation 'org.springframework.boot:spring-boot-starter-webmvc'
  implementation 'org.springframework.boot:spring-boot-starter-validation'
  implementation "org.graalvm.polyglot:polyglot:${graalvmVersion}"
  implementation "dev.langchain4j:langchain4j-open-ai:${langchain4jVersion}"
  implementation "org.graalvm.scriptagent:scriptagent:${scriptagentVersion}"
  implementation "org.graalvm.scriptagent:scriptagent-langchain4j:${scriptagentVersion}"
  implementation 'javax.cache:cache-api'
  implementation 'jakarta.xml.bind:jakarta.xml.bind-api'
  runtimeOnly 'org.springframework.boot:spring-boot-starter-actuator'
  runtimeOnly "org.webjars:webjars-locator-lite:${webjarsLocatorLiteVersion}"
  runtimeOnly "org.webjars.npm:bootstrap:${webjarsBootstrapVersion}"
  runtimeOnly "org.webjars.npm:font-awesome:${webjarsFontawesomeVersion}"
  runtimeOnly 'com.github.ben-manes.caffeine:caffeine'
  runtimeOnly 'com.h2database:h2'
  runtimeOnly 'com.oracle.database.jdbc:ojdbc11'
  runtimeOnly "org.graalvm.polyglot:js:${graalvmVersion}"
  runtimeOnly "org.graalvm.polyglot:${jsIsolateArtifact}:${graalvmVersion}"
  developmentOnly 'org.springframework.boot:spring-boot-devtools'
  testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
  testImplementation 'org.springframework.boot:spring-boot-starter-restclient-test'
  testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
  testImplementation 'org.springframework.boot:spring-boot-testcontainers'
  testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
  testImplementation 'org.testcontainers:testcontainers-oracle-free'
  checkstyle "io.spring.javaformat:spring-javaformat-checkstyle:${springJavaformatCheckstyleVersion}"
  checkstyle "com.puppycrawl.tools:checkstyle:${checkstyleVersion}"
}

tasks.named('test') {
  useJUnitPlatform()
}

graalvmNative {
  binaries {
    main {
      buildArgs.add('--initialize-at-run-time=sun.security.util.Password$ConsoleHolder')
    }
  }
}

tasks.named("cyclonedxDirectBom").configure {
  dependsOn("compileJava")
  skipConfigs = [".*[Tt]est.*"]
}

checkstyle {
  configDirectory = project.file('src/checkstyle')
  configFile = file('src/checkstyle/nohttp-checkstyle.xml')
}

checkstyleNohttp {
  configDirectory = project.file('src/checkstyle')
  configFile = file('src/checkstyle/nohttp-checkstyle.xml')
}

tasks.named("formatMain").configure { dependsOn("checkstyleMain") }
tasks.named("formatMain").configure { dependsOn("checkstyleNohttp") }

tasks.named("formatTest").configure { dependsOn("checkstyleTest") }
tasks.named("formatTest").configure { dependsOn("checkstyleNohttp") }

checkstyleAot.enabled = false
checkstyleAotTest.enabled = false

checkFormatAot.enabled = false
checkFormatAotTest.enabled = false

formatAot.enabled = false
formatAotTest.enabled = false
